services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - TRANSCRIBE_PORT=5001
      - TRANSCRIBE_HOST=python
    volumes:
      - ./data:/app/data
    depends_on:
      - python
    restart: unless-stopped

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "5001:5001"
    env_file:
      - .env
    restart: unless-stopped
