<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Live Captions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary-size: 2.2rem;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(74, 222, 128, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Header ── */
    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(5,5,16,0.9);
      backdrop-filter: blur(10px);
      z-index: 50;
      flex-shrink: 0;
    }

    #app-title {
      font-size: 1rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 0.04em;
    }

    #conn-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
    }

    #connected-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f87171;
      transition: background 0.3s;
    }
    #connected-dot.on {
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74,222,128,0.6);
    }
    #connected-dot.reconnecting {
      background: #fbbf24;
      animation: reconnect-pulse 1s ease-in-out infinite;
    }
    @keyframes reconnect-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    
    #controls-row {
      display: flex; align-items: center; gap: 8px;
    }

    .font-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .font-btn:hover {
      background: rgba(74,222,128,0.1);
      border-color: rgba(74,222,128,0.3);
      color: #4ade80;
    }

    /* MAIN GRID LAYOUT */
    #main {
      flex:1; display:grid; gap:1px; overflow:hidden; background:rgba(255,255,255,0.05);
    }
    #main.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #main.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    #main.layout-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    #main.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    #main.layout-3 .text-panel:nth-child(3) { grid-column: span 2; }

    .text-panel{background:#050510; display:flex; flex-direction:column; overflow:hidden;}
    .panel-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:rgba(5,5,16,0.6);border-bottom:1px solid rgba(255,255,255,0.035);}
    .panel-title{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.25);}
    
    .text-scroll{flex:1;overflow-y:auto;padding:28px 32px;}
    .text-scroll::-webkit-scrollbar{width:3px;}
    .text-scroll::-webkit-scrollbar-track{background:transparent;}
    .text-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:3px;}

    .paragraph {
      font-size: var(--primary-size);
      line-height: 2;
      color: rgba(255,255,255,0.8);
      word-break: break-word;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: font-size 0.2s;
    }
    .paragraph .text { white-space: pre-wrap; }
    .paragraph .text .cursor {
      display: inline-block; width: 2px; height: 1.8rem; background: #4ade80; margin-left: 2px;
      animation: blink 1s step-end infinite; vertical-align: text-bottom;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .text-placeholder{color:rgba(255,255,255,0.1);font-size:0.9rem;text-align:center;margin-top:auto;padding-top:60px;}

    /* ISL PANEL */
    #isl-panel {
      display: none; /* hidden by default */
      flex-shrink: 0;
      height: 250px;
      background: rgba(0,0,0,0.8);
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    #isl-panel.visible { display: flex; }
    #isl-video-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #000; overflow: hidden;
    }
    #isl-image { max-height: 100%; max-width: 100%; object-fit: contain; }
    #isl-label {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 600; color: #4ade80;
    }
    #isl-current-word {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <div id="app-title">⚡ Sarva</div>
    
    <div id="controls-row">
      <button class="font-btn" onclick="changeFontSize(-0.2)" title="Smaller">A−</button>
      <button class="font-btn" onclick="changeFontSize(0.2)" title="Larger">A+</button>
    </div>

    <div id="conn-status">
      <span id="connected-dot"></span>
      <span id="conn-text">Connecting...</span>
    </div>
  </header>

  <!-- Main Grid for Languages -->
  <div id="main" class="layout-2"></div>

  <!-- ISL Panel -->
  <div id="isl-panel">
    <div id="isl-label">Indian Sign Language</div>
    <div id="isl-video-container">
      <img id="isl-image" src="" alt="ISL Sign" style="display:none;" />
      <div id="isl-current-word"></div>
    </div>
  </div>

  <script>
    let socket;
    let captions = [];
    let activeLanguages = ["en", "hi"];
    const ALL_LANGUAGES = {
      "en": "English", "hi": "Hindi", "ta": "Tamil", "te": "Telugu", "kn": "Kannada", "ml": "Malayalam",
      "mr": "Marathi", "gu": "Gujarati", "pa": "Punjabi", "bn": "Bengali", "ur": "Urdu",
      "fr": "French", "es": "Spanish", "de": "German", "ja": "Japanese", "ko": "Korean", "zh-CN": "Chinese"
    };

    let baseSize = 2.2;
    function changeFontSize(delta) {
      baseSize += delta;
      if(baseSize < 1) baseSize = 1;
      if(baseSize > 4) baseSize = 4;
      document.documentElement.style.setProperty('--primary-size', baseSize + 'rem');
    }

    function renderGrid() {
      const main = document.getElementById("main");
      main.className = `layout-${activeLanguages.length}`;
      main.innerHTML = "";
      
      activeLanguages.forEach(lang => {
        const name = ALL_LANGUAGES[lang] || lang;
        const panel = document.createElement("div");
        panel.className = "text-panel";
        panel.id = `panel-${lang}`;
        
        panel.innerHTML = `
          <div class="panel-header">
            <span class="panel-title">${name}</span>
          </div>
          <div class="text-scroll" id="scroll-${lang}">
            <div class="paragraph" id="para-${lang}">
              <div class="text-placeholder" id="empty-${lang}">Waiting for speech...</div>
            </div>
          </div>
        `;
        main.appendChild(panel);
      });
      renderParagraphs();
    }

    function renderParagraphs(){
      if (captions.length === 0) return;
      activeLanguages.forEach(lang => {
        const para = document.getElementById(`para-${lang}`);
        const scroll = document.getElementById(`scroll-${lang}`);
        const empty = document.getElementById(`empty-${lang}`);
        if(!para || !scroll || !empty) return;
        
        empty.style.display = "none";
        const old = para.querySelector(".text");
        if(old) old.remove();

        const fullText = captions.map(c => c[lang] || c.original).join(" ");
        const span = document.createElement("span");
        span.className = "text";
        span.textContent = fullText;

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        span.appendChild(cursor);

        para.appendChild(span);
        scroll.scrollTop = scroll.scrollHeight;
      });
      
      // ISL trigger
      if (document.getElementById("isl-panel").classList.contains("visible")) {
        const latestEn = captions.map(c => c["en"] || c.original).join(" ");
        if (typeof playISLForText === "function") playISLForText(latestEn);
      }
    }

    function connectSocket() {
      socket = io(window.location.origin, {
        query: { type: "student" },
        reconnection: true,
        reconnectionDelay: 1000,
      });

      socket.on("connect", () => {
        document.getElementById("connected-dot").className = "on";
        document.getElementById("conn-text").textContent = "Connected";
      });

      socket.on("disconnect", () => {
        document.getElementById("connected-dot").className = "reconnecting";
        document.getElementById("conn-text").textContent = "Reconnecting...";
      });

      socket.on("layout-update", (langs) => {
        if(Array.isArray(langs)){
          activeLanguages = langs;
          renderGrid();
        }
      });
      
      socket.on("isl-visibility", (visible) => {
        const panel = document.getElementById("isl-panel");
        if (visible) {
          panel.classList.add("visible");
          if(!document.getElementById("isl-translator-script")){
             const s = document.createElement("script");
             s.id = "isl-translator-script";
             s.src = "js/isl-translator.js";
             document.body.appendChild(s);
          }
        } else {
          panel.classList.remove("visible");
        }
      });

      socket.on("caption", (data) => {
        captions.push(data);
        if(captions.length > 300) captions.shift();
        renderParagraphs();
      });
    }

    window.onload = () => {
      renderGrid();
      connectSocket();
    };
  </script>
</body>
</html>
