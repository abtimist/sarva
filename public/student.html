<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Live Captions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --caption-size: 1.5rem; }
    * { margin: 0; padding: 0; box-sizing: border-box; }


    body {
      background: #050510;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(74, 222, 128, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    #app-title {
      font-size: 1rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 0.04em;
    }

    #conn-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
    }

    #connected-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f87171;
      transition: background 0.3s;
    }
    #connected-dot.on {
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74,222,128,0.6);
    }

    /* ── Language Picker ── */
    #lang-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
      max-width: 600px;
    }

    .lang-btn {
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      background: rgba(74,222,128,0.1);
      border-color: rgba(74,222,128,0.3);
      color: #fff;
    }
    .lang-btn.active {
      background: rgba(74,222,128,0.15);
      color: #4ade80;
      border-color: rgba(74,222,128,0.5);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(74,222,128,0.15);
    }

    /* ── Captions ── */
    #captions {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .caption-line {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid rgba(74,222,128,0.7);
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.5;
      animation: slideUp 0.35s ease;
      backdrop-filter: blur(8px);
    }

    .caption-line:last-child {
      background: rgba(74,222,128,0.06);
      border-color: rgba(74,222,128,0.2);
      border-left-color: #4ade80;
      color: #fff;
      font-weight: 600;
    }

    .caption-line:not(:last-child) {
      color: rgba(255,255,255,0.45);
      font-size: 1.1rem;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #waiting {
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
      margin-top: 60px;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .caption-line { font-size: var(--caption-size) !important; }

    /* Font size controls */
    #font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    #font-controls span {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    .font-btn {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.55);
      font-size: 1rem;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .font-btn:hover {
      background: rgba(74,222,128,0.1);
      border-color: rgba(74,222,128,0.3);
      color: #4ade80;
    }
  </style>
</head>
<body>

  <header>
    <div id="app-title">⚡ Sarva</div>
    <div id="conn-status">
      <span id="connected-dot"></span>
      <span id="conn-text">Connecting...</span>
    </div>
  </header>

  <div id="lang-picker">
    <button class="lang-btn active" data-lang="en" onclick="setLang(this)">English</button>
    <button class="lang-btn" data-lang="hi" onclick="setLang(this)">हिन्दी</button>
    <button class="lang-btn" data-lang="ta" onclick="setLang(this)">தமிழ்</button>
    <button class="lang-btn" data-lang="kn" onclick="setLang(this)">ಕನ್ನಡ</button>
    <button class="lang-btn" data-lang="te" onclick="setLang(this)">తెలుగు</button>
    <button class="lang-btn" data-lang="ml" onclick="setLang(this)">മലയാളം</button>
  </div>

  <div id="font-controls">
    <span>Text size</span>
    <button class="font-btn" onclick="changeFontSize(-0.15)" title="Smaller">A−</button>
    <button class="font-btn" onclick="changeFontSize(0.15)"  title="Larger">A+</button>
  </div>

  <div id="captions">
    <div id="waiting">Waiting for teacher to start speaking...</div>
  </div>

  <script>
    let socket;
    if (typeof io !== "undefined") {
      socket = io(window.location.origin, { query: { type: "student" } });
    } else {
      const textEl = document.getElementById("conn-text");
      if (textEl) textEl.textContent = "Error: Socket.io failed to load";
    }

    let selectedLang = "en";
    const captionBuffer = [];
    let currentFontSize = 1.5;

    function changeFontSize(delta) {
      currentFontSize = Math.min(3.5, Math.max(0.9, currentFontSize + delta));
      document.documentElement.style.setProperty('--caption-size', currentFontSize + 'rem');
    }

    if (socket) {
      socket.on("connect", () => {
        document.getElementById("connected-dot").classList.add("on");
        document.getElementById("conn-text").textContent = "Connected";
      });
      socket.on("disconnect", () => {
        document.getElementById("connected-dot").classList.remove("on");
        document.getElementById("conn-text").textContent = "Disconnected";
      });
    }

    function setLang(btn) {
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedLang = btn.dataset.lang;
      captionBuffer.length = 0;
      const container = document.getElementById("captions");
      container.innerHTML = '<div id="waiting">Waiting for teacher to start speaking...</div>';
    }

    function renderBuffer() {
      const container = document.getElementById("captions");
      container.innerHTML = "";
      captionBuffer.forEach(data => {
        const div = document.createElement("div");
        div.className = "caption-line";
        div.textContent = data[selectedLang] || data.original;
        container.appendChild(div);
      });
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    if (socket) {
      socket.on("caption", (data) => {
        document.getElementById("waiting")?.remove();
        captionBuffer.push(data);
        if (captionBuffer.length > 6) captionBuffer.shift();
        renderBuffer();
      });
    }
  </script>
</body>
</html>
