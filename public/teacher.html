<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Teacher Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06060f;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 10% 90%, rgba(74,222,128,0.055) 0%, transparent 45%),
        radial-gradient(ellipse at 90% 10%, rgba(99,102,241,0.045) 0%, transparent 45%);
      pointer-events: none;
    }

    /* ─── Top Bar ─── */
    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      background: rgba(6,6,15,0.95);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.055);
      z-index: 50;
    }

    #logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #4ade80;
      letter-spacing: 0.04em;
    }
    #logo-sub { font-size: 0.72rem; font-weight: 400; color: rgba(255,255,255,0.25); letter-spacing: 0.02em; }

    #topbar-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tb-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 13px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.035);
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      transition: all 0.3s ease;
      letter-spacing: 0.01em;
    }

    #status-pill.recording {
      background: rgba(74,222,128,0.12);
      border-color: rgba(74,222,128,0.28);
      color: #4ade80;
    }
    #status-pill.error {
      background: rgba(248,113,113,0.12);
      border-color: rgba(248,113,113,0.28);
      color: #f87171;
    }

    #latency-pill.fast  { color: #4ade80; border-color: rgba(74,222,128,0.22); }
    #latency-pill.medium{ color: #fbbf24; border-color: rgba(251,191,36,0.22); }
    #latency-pill.slow  { color: #f87171; border-color: rgba(248,113,113,0.22); }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: dot-pulse 2s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(74,222,128,0.5); }
      50% { opacity:0.5; box-shadow:0 0 0 3px rgba(74,222,128,0); }
    }

    /* ─── Floating QR ─── */
    #qr-card {
      position: fixed;
      top: 68px;
      right: 20px;
      z-index: 40;
      background: rgba(8,8,20,0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 12px 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    #qr-inner {
      background: #fff;
      border-radius: 10px;
      padding: 7px;
      line-height: 0;
    }
    #qr-card-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    #qr-url {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.2);
      text-align: center;
      max-width: 130px;
      word-break: break-all;
      line-height: 1.4;
    }

    /* ─── Main ─── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 200px 16px 40px;
      position: relative;
    }

    /* Detected language badge */
    #detected-lang-badge {
      height: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(74,222,128,0.55);
      margin-bottom: 14px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #detected-lang-badge.visible { opacity: 1; }
    #detected-lang-badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #4ade80;
    }

    /* Caption */
    #caption-wrap {
      width: 100%;
      max-width: 960px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #caption {
      font-size: 4.5rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.18;
      color: #fff;
      transition: all 0.35s ease;
      word-break: break-word;
    }
    #caption.empty {
      color: rgba(255,255,255,0.08);
      font-size: 1.6rem;
      font-weight: 400;
    }

    /* Listening pulse (...) */
    #listening-dots {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
    }
    #listening-dots.active { display: flex; }
    #listening-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(74,222,128,0.45);
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    #listening-dots span:nth-child(2) { animation-delay: 0.15s; }
    #listening-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot-bounce {
      0%,60%,100% { transform:translateY(0); background:rgba(74,222,128,0.4); }
      30% { transform:translateY(-6px); background:rgba(74,222,128,0.9); }
    }

    /* Waveform */
    #waveform-wrap {
      width: 100%;
      max-width: 720px;
      height: 52px;
      margin-top: 22px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #waveform-wrap.active { opacity: 1; }
    #waveform { width:100%; height:100%; }

    /* ─── Bottom Controls ─── */
    #controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(6,6,15,0.92);
      backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.055);
    }

    .lang-btn {
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 7px 18px;
      font-size: 0.88rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
    }
    .lang-btn:hover {
      background: rgba(74,222,128,0.08);
      border-color: rgba(74,222,128,0.25);
      color: #e2e8f0;
    }
    .lang-btn.active {
      background: rgba(74,222,128,0.13);
      border-color: rgba(74,222,128,0.45);
      color: #4ade80;
      font-weight: 700;
    }

    .ctrl-sep {
      width: 1px; height: 26px;
      background: rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    #mic-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 10px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.22s ease;
      box-shadow: 0 4px 18px rgba(74,222,128,0.28);
      white-space: nowrap;
    }
    #mic-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(74,222,128,0.42); }
    #mic-btn:active { transform: translateY(0); }
    #mic-btn.active {
      background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
      box-shadow: 0 4px 18px rgba(248,113,113,0.32);
    }
    #mic-btn.active:hover { box-shadow: 0 6px 22px rgba(248,113,113,0.48); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div id="topbar">
    <div id="logo">⚡ Sarva <span id="logo-sub">Teacher Display</span></div>
    <div id="topbar-pills">
      <div class="tb-pill" id="student-pill">
        <span class="live-dot"></span>
        <span id="student-count-text">0 Students</span>
      </div>
      <div class="tb-pill" id="timer-pill">⏱ 00:00</div>
      <div class="tb-pill" id="latency-pill">— ms</div>
      <div class="tb-pill" id="status-pill">Not recording</div>
    </div>
  </div>

  <!-- Floating QR -->
  <div id="qr-card">
    <div id="qr-card-label">Scan to join</div>
    <div id="qr-inner"><div id="qrcode"></div></div>
    <div id="qr-url"></div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="detected-lang-badge">Detecting language...</div>
    <div id="caption-wrap">
      <div id="caption" class="empty">Waiting for speech...</div>
    </div>
    <div id="listening-dots">
      <span></span><span></span><span></span>
    </div>
    <div id="waveform-wrap">
      <canvas id="waveform"></canvas>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div id="controls">
    <button class="lang-btn active" data-lang="en"  onclick="setDisplayLang(this)">English</button>
    <button class="lang-btn"        data-lang="hi"  onclick="setDisplayLang(this)">हिन्दी</button>
    <button class="lang-btn"        data-lang="ta"  onclick="setDisplayLang(this)">தமிழ்</button>
    <button class="lang-btn"        data-lang="kn"  onclick="setDisplayLang(this)">ಕನ್ನಡ</button>
    <button class="lang-btn"        data-lang="te"  onclick="setDisplayLang(this)">తెలుగు</button>
    <button class="lang-btn"        data-lang="ml"  onclick="setDisplayLang(this)">മലയാളം</button>
    <div class="ctrl-sep"></div>
    <button id="mic-btn" onclick="toggleRecording()">🎤 Start Recording</button>
  </div>

  <script>
// ── Socket ──
let socket;
if (typeof io !== "undefined") {
  socket = io();
} else {
  document.getElementById("status-pill").textContent = "Socket failed";
  document.getElementById("status-pill").classList.add("error");
}

// ── State ──
let stream = null;
let loopActive = false;
let displayLang = "en";
let audioCtx = null;
let analyser = null;
let waveAnimId = null;
let sessionInterval = null;
let sessionSeconds = 0;
let listeningTimeout = null;

// ── Language map for display ──
const LANG_NAMES = {
  "en-IN": "English", "hi-IN": "Hindi", "ta-IN": "Tamil",
  "kn-IN": "Kannada", "te-IN": "Telugu", "ml-IN": "Malayalam",
  "bn-IN": "Bengali", "gu-IN": "Gujarati", "mr-IN": "Marathi",
  "pa-IN": "Punjabi", "or-IN": "Odia", "as-IN": "Assamese",
};

// ── QR Code ──
async function generateQR() {
  let studentUrl;
  try {
    const res = await fetch("/server-ip");
    const data = await res.json();
    studentUrl = `http://${data.ip}:${data.port}/student`;
  } catch (e) {
    studentUrl = window.location.origin + "/student";
  }

  document.getElementById("qr-url").textContent = studentUrl;

  if (typeof QRCode !== "undefined") {
    new QRCode(document.getElementById("qrcode"), {
      text: studentUrl, width: 116, height: 116,
      colorDark: "#000", colorLight: "#fff",
    });
  } else {
    document.getElementById("qr-inner").innerHTML =
      `<div style="width:116px;height:116px;display:flex;align-items:center;justify-content:center;color:#f87171;font-size:0.7rem;text-align:center">QR unavailable</div>`;
  }
}
generateQR();

// ── Display language ──
function setDisplayLang(btn) {
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  displayLang = btn.dataset.lang;
}

// ── Socket events ──
if (socket) {
  socket.on("caption", (data) => {
    const text = data[displayLang] || data.original;

    clearTimeout(listeningTimeout);
    document.getElementById("listening-dots").classList.remove("active");

    const el = document.getElementById("caption");
    el.classList.remove("empty");
    el.textContent = text;

    // Show detected language badge
    if (data.detectedLang) {
      const name = LANG_NAMES[data.detectedLang] || data.detectedLang;
      const badge = document.getElementById("detected-lang-badge");
      badge.textContent = `Detected: ${name}`;
      badge.classList.add("visible");
    }

    // Latency badge
    if (data.processingMs !== undefined) {
      const lp = document.getElementById("latency-pill");
      lp.textContent = `${data.processingMs} ms`;
      lp.className = "tb-pill" + (data.processingMs < 1500 ? " fast" : data.processingMs < 3000 ? " medium" : " slow");
    }

    // After 4s of silence, show listening dots again if still recording
    if (loopActive) {
      listeningTimeout = setTimeout(() => {
        document.getElementById("listening-dots").classList.add("active");
      }, 4000);
    }
  });

  socket.on("student-count", (count) => {
    document.getElementById("student-count-text").textContent =
      `${count} Student${count !== 1 ? "s" : ""}`;
  });
}

// ── Session Timer ──
function startTimer() {
  sessionSeconds = 0;
  sessionInterval = setInterval(() => {
    sessionSeconds++;
    const m = String(Math.floor(sessionSeconds / 60)).padStart(2, "0");
    const s = String(sessionSeconds % 60).padStart(2, "0");
    document.getElementById("timer-pill").textContent = `⏱ ${m}:${s}`;
  }, 1000);
}
function stopTimer() {
  clearInterval(sessionInterval);
  document.getElementById("timer-pill").textContent = "⏱ 00:00";
}

// ── Recording ──
async function toggleRecording() {
  loopActive ? stopRecording() : await startRecording();
}

async function startRecording() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Microphone access not supported." + (!window.isSecureContext ? " Requires HTTPS or localhost." : ""));
    }
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    loopActive = true;
    await fetch("/recording/start", { method: "POST" });

    document.getElementById("mic-btn").innerHTML = "⏹ Stop Recording";
    document.getElementById("mic-btn").classList.add("active");
    const sp = document.getElementById("status-pill");
    sp.textContent = "🔴 Recording";
    sp.className = "tb-pill recording";

    startTimer();
    startWaveform();

    // Show listening dots immediately
    document.getElementById("caption").classList.add("empty");
    document.getElementById("caption").textContent = "Listening...";
    document.getElementById("listening-dots").classList.add("active");

    recordLoop();
  } catch (e) {
    const sp = document.getElementById("status-pill");
    sp.textContent = "⚠ " + e.message;
    sp.className = "tb-pill error";
    loopActive = false;
  }
}

function stopRecording() {
  loopActive = false;
  clearTimeout(listeningTimeout);
  fetch("/recording/stop", { method: "POST" });

  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  stopWaveform();
  stopTimer();

  document.getElementById("mic-btn").innerHTML = "🎤 Start Recording";
  document.getElementById("mic-btn").classList.remove("active");
  const sp = document.getElementById("status-pill");
  sp.textContent = "Not recording";
  sp.className = "tb-pill";
  document.getElementById("caption").textContent = "Waiting for speech...";
  document.getElementById("caption").classList.add("empty");
  document.getElementById("listening-dots").classList.remove("active");
  document.getElementById("detected-lang-badge").classList.remove("visible");
}

// ── Waveform ──
function startWaveform() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  audioCtx.createMediaStreamSource(stream).connect(analyser);

  const wrap = document.getElementById("waveform-wrap");
  const canvas = document.getElementById("waveform");
  wrap.classList.add("active");
  canvas.width = wrap.clientWidth * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width = wrap.clientWidth + "px";
  canvas.style.height = wrap.clientHeight + "px";

  drawWaveform();
}

function drawWaveform() {
  if (!analyser) return;
  waveAnimId = requestAnimationFrame(drawWaveform);

  const canvas = document.getElementById("waveform");
  const ctx = canvas.getContext("2d");
  const buf = analyser.frequencyBinCount;
  const data = new Uint8Array(buf);
  analyser.getByteTimeDomainData(data);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  grad.addColorStop(0,   "rgba(74,222,128,0.15)");
  grad.addColorStop(0.5, "rgba(74,222,128,0.85)");
  grad.addColorStop(1,   "rgba(74,222,128,0.15)");

  ctx.lineWidth = 2.5 * devicePixelRatio;
  ctx.strokeStyle = grad;
  ctx.shadowColor = "#4ade80";
  ctx.shadowBlur = 10;
  ctx.beginPath();

  const slice = canvas.width / buf;
  let x = 0;
  for (let i = 0; i < buf; i++) {
    const y = (data[i] / 128) * (canvas.height / 2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    x += slice;
  }
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
}

function stopWaveform() {
  if (waveAnimId) { cancelAnimationFrame(waveAnimId); waveAnimId = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; }
  const wrap = document.getElementById("waveform-wrap");
  wrap.classList.remove("active");
  const canvas = document.getElementById("waveform");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
}

// ── Record loop ──
function recordLoop() {
  if (!loopActive || !stream?.active) return;

  const chunks = [];
  let recorder;
  try {
    recorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
  } catch {
    recorder = new MediaRecorder(stream);
  }

  recorder.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };

  recorder.onstop = () => {
    if (!loopActive) return;
    if (chunks.length > 0) {
      const blob = new Blob(chunks, { type: "audio/webm" });
      if (blob.size > 500) {
        const form = new FormData();
        form.append("audio", blob, "audio.webm");
        fetch("/audio-chunk", { method: "POST", body: form })
          .catch(err => console.warn("Upload error:", err));
      }
    }
    if (loopActive) recordLoop();
  };

  recorder.onerror = () => { if (loopActive) setTimeout(recordLoop, 300); };

  recorder.start();
  setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, 2000);
}
  </script>
</body>
</html>
