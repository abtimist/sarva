<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Live Captions & Translation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4ade80;
      --primary-hover: #22c55e;
      --bg: #050510;
      --surface: rgba(255,255,255,0.03);
      --surface-border: rgba(255,255,255,0.08);
      --text: #fff;
      --text-muted: rgba(255,255,255,0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(74, 222, 128, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(20px);
      z-index: 1;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .switch-mode {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .switch-mode button {
      background: none;
      border: none;
      color: var(--primary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding-left: 4px;
    }

    .switch-mode button:hover {
      text-decoration: underline;
    }

    #error-msg {
      color: #ef4444;
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 16px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Sarva</div>
    <div class="subtitle" id="form-title">Sign in to your dashboard</div>

    <div id="error-msg"></div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="submit-btn">Sign In</button>
    </form>

    <div class="switch-mode">
      <span id="switch-text">Don't have an account?</span>
      <button type="button" id="switch-btn">Sign Up</button>
    </div>
  </div>

  <script>
    let isLogin = true;
    const form = document.getElementById('auth-form');
    const switchBtn = document.getElementById('switch-btn');
    const formTitle = document.getElementById('form-title');
    const switchText = document.getElementById('switch-text');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    // Check if already logged in
    if (localStorage.getItem('sarva_user_id')) {
      window.location.href = '/dashboard.html';
    }

    switchBtn.addEventListener('click', () => {
      isLogin = !isLogin;
      errorMsg.textContent = '';
      if (isLogin) {
        formTitle.textContent = 'Sign in to your dashboard';
        submitBtn.textContent = 'Sign In';
        switchText.textContent = "Don't have an account?";
        switchBtn.textContent = 'Sign Up';
      } else {
        formTitle.textContent = 'Create a new account';
        submitBtn.textContent = 'Sign Up';
        switchText.textContent = "Already have an account?";
        switchBtn.textContent = 'Sign In';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const endpoint = isLogin ? '/api/login' : '/api/signup';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('sarva_user_id', data.userId);
          window.location.href = '/dashboard.html';
        } else {
          errorMsg.textContent = data.error || 'Authentication failed';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLogin ? 'Sign In' : 'Sign Up';
      }
    });
  </script>
</body>
</html>
