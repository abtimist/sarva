<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Session Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/notes.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header>
    <div id="app-title">⚡ Sarva</div>
    <a id="back-btn" href="/student">← Back</a>
  </header>

  <div id="actions">
    <button class="action-btn" id="download-all-btn" onclick="downloadAllNotes()" disabled>📥 Download All Notes PDF</button>
  </div>

  <div id="notes-container">
    <div id="loading"><span class="spinner"></span> Loading notes...</div>
  </div>

  <div id="empty-state" style="display:none;">No notes yet. Notes appear here when the teacher saves them.</div>

  <div id="ai-loading-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-family:'Outfit',sans-serif;">
    <span class="spinner" style="width:40px; height:40px; border-width:3px; margin-bottom:15px; margin-right:0;"></span>
    <h2 style="font-size:1.2rem; color:#4ade80;">Generating AI Notes...</h2>
    <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); margin-top:8px;">This might take a few seconds.</p>
  </div>

  <div id="toast"></div>

  <script src="js/notes.js"></script>
</body>
</html>
