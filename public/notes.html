<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Session Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/notes.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
</head>
<body>

  <header>
    <div id="app-title">⚡ Sarva</div>
    <a id="back-btn" href="/student">← Back</a>
  </header>

  <div id="actions">
    <button class="action-btn" id="download-all-btn" onclick="downloadAllNotes()" disabled>📥 Download All Notes PDF</button>
  </div>

  <div id="notes-container">
    <div id="loading"><span class="spinner"></span> Loading notes...</div>
  </div>

  <div id="empty-state" style="display:none;">No notes yet. Notes appear here when the teacher saves them.</div>

  <div id="toast"></div>

  <script src="js/notes.js"></script>
</body>
</html>
