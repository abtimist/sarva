<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarva — Teacher Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="qrcode.min.js"></script>
</head>
<body>

  <div id="topbar">
    <div id="logo">⚡ Sarva <span id="logo-sub">Teacher</span></div>
    <div id="topbar-pills">
      <div class="tb-pill"><span class="live-dot"></span><span id="student-count-text">0</span></div>
      <div class="tb-pill" id="timer-pill">⏱ 00:00</div>
      <div class="tb-pill" id="latency-pill">— ms</div>
      <div class="tb-pill" id="status-pill">Idle</div>
    </div>
  </div>

  <div id="qr-card" onclick="this.classList.toggle('minimized')">
    <div id="qr-card-label">Scan to join</div>
    <div id="qr-inner"><div id="qrcode"></div></div>
    <div id="qr-url"></div>
  </div>

  <div id="main">
    <div class="text-panel" id="panel-en">
      <div class="panel-header">
        <span class="panel-title">🇬🇧 English</span>
        <span id="detected-badge">Detecting...</span>
      </div>
      <div class="text-scroll" id="scroll-en">
        <div class="paragraph" id="para-en">
          <div class="text-placeholder" id="empty-en">Waiting for speech...</div>
        </div>
      </div>
    </div>
    <div class="text-panel" id="panel-lang">
      <div class="panel-header">
        <span class="panel-title"><span id="lang-flag">🇮🇳</span> <span id="lang-label">Hindi</span></span>
      </div>
      <div class="text-scroll" id="scroll-lang">
        <div class="paragraph" id="para-lang">
          <div class="text-placeholder" id="empty-lang">Waiting for speech...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="waveform-wrap"><canvas id="waveform"></canvas></div>

  <div id="controls">
    <button class="lang-btn" data-lang="hi" onclick="setDisplayLang(this)">हिन्दी</button>
    <button class="lang-btn" data-lang="ta" onclick="setDisplayLang(this)">தமிழ்</button>
    <button class="lang-btn" data-lang="kn" onclick="setDisplayLang(this)">ಕನ್ನಡ</button>
    <button class="lang-btn" data-lang="te" onclick="setDisplayLang(this)">తెలుగు</button>
    <button class="lang-btn" data-lang="ml" onclick="setDisplayLang(this)">മലയാളം</button>
    <div class="ctrl-sep"></div>
    <button id="mic-btn" onclick="toggleRecording()">🎤 Start</button>
    <div class="ctrl-sep"></div>
    <button id="notes-btn" onclick="toggleNotes()">📝 Notes <span class="badge" id="notes-badge">0</span></button>
    <a id="notes-page-link" href="/notes?from=teacher">📄 All Notes</a>
  </div>

  <div id="drawer-backdrop" onclick="toggleNotes()"></div>

  <div id="merge-overlay">
    <div id="merge-dialog">
      <h3>Recording Saved</h3>
      <p>Where would you like to save this recording?</p>
      <div id="merge-preview"></div>
      <div class="merge-options" id="merge-options"></div>
      <div class="merge-btns">
        <button class="merge-btn cancel" onclick="closeMergeDialog()">Cancel</button>
        <button class="merge-btn confirm" onclick="confirmMerge()">Save</button>
      </div>
    </div>
  </div>
  <div id="notes-drawer">
    <div id="notes-header">
      <h3>📝 Session Notes</h3>
      <button id="notes-close" onclick="toggleNotes()">✕</button>
    </div>
    <div id="session-tabs"></div>
    <div id="notes-content">
      <div class="notes-text" id="notes-text"></div>
      <div id="notes-empty">Notes auto-save when recording stops.</div>
    </div>
    <div id="note-input-area">
      <input type="text" id="note-input" placeholder="Add a note..." maxlength="500">
      <button id="note-send" onclick="sendNote()">Add</button>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
